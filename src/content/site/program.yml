en:
  note: We will announce the exact start and end times later.
  stages:
    - title: Participant registration
      description: Teams collect their badges and go to their committees.
    - duration: 20–30 min
      title: Opening ceremony and briefing
      description: Welcome, introduction of the organisers and the jury, explanation of the rules, committees, deliverables and scoring.
    - duration: 60 min
      title: 'Session 1: research'
      description: Define a specific problem, formulate a research question, find reliable sources, collect data and develop a preliminary solution.
    - duration: 10 min
      title: Break
      description: Rest and informal networking.
    - duration: 80 min
      title: 'Session 2: writing'
      description: Turn research notes into a Research Solution Brief, develop the solution, add citations, check feasibility and submit the PDF.
    - duration: 50 min
      title: Lunch
    - duration: about 60 min
      title: 'Session 3: presentations'
      description: A 3–4 minute presentation and 2 minutes of questions and answers per team. The jury scores during the presentations.
    - duration: 15–40 min
      title: Results and awards
      description: The jury checks the totals and approves the awards. Winners are awarded and every participant receives a certificate.
