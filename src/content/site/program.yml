ru:
  note: Точное время начала и окончания объявим позже.
  stages:
    - time: ''
      duration: ''
      title: Регистрация участников
      description: Команды получают бейджи и проходят в свои комитеты.
      kind: ''
    - time: ''
      duration: 20–30 мин
      title: Торжественное открытие и инструктаж
      description: Приветствие, представление организаторов и жюри, разъяснение правил, комитетов, требований к результатам и системы оценивания.
      kind: ''
    - time: ''
      duration: 60 мин
      title: 'Сессия 1: исследовательский этап'
      description: Определить конкретную проблему, сформулировать исследовательский вопрос, найти надёжные источники, собрать данные и разработать предварительное решение.
      kind: session
    - time: ''
      duration: 10 мин
      title: Перерыв
      description: Отдых и неформальное общение.
      kind: break
    - time: ''
      duration: 80 мин
      title: 'Сессия 2: письменный этап'
      description: Превратить исследовательские заметки в исследовательскую записку, доработать решение, добавить ссылки на источники, проверить реализуемость и сдать PDF-файл.
      kind: session
    - time: ''
      duration: 50 мин
      title: Обед
      description: ''
      kind: break
    - time: ''
      duration: около 60 мин
      title: 'Сессия 3: устный этап'
      description: Презентация 3–4 минуты и 2 минуты вопросов и ответов на каждую команду. Жюри выставляет баллы во время выступлений.
      kind: session
    - time: ''
      duration: 15–40 мин
      title: Итоги и награждение
      description: Жюри проверяет итоговые суммы и утверждает награды. Победителей награждают, все участники получают сертификаты.
      kind: ''
