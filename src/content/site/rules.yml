ru:
  intro: Официальный формат мероприятия, требования к работе команды и критерии, по которым оценивает жюри.
  sections:
    - title: Формат турнира
      body: |-
        - В команде 2–4 участника.
        - Команда регистрируется в один тематический комитет.
        - Каждая команда подаёт одну исследовательскую записку (Research Solution Brief) и выступает с одной устной презентацией.
        - Итоговая оценка — 100 баллов: 50 за исследование и 50 за устное выступление.
        - Рабочие языки: английский, казахский и русский.
    - title: Подготовка
      body: |-
        После регистрации организаторы могут направить каждому участнику выбранный комитет, краткое описание, 3–5 рекомендуемых источников и базовый исследовательский чек-лист.

        Эти источники — отправная точка, а не готовые ответы. Участники должны самостоятельно отбирать и цитировать данные, которые они действительно используют.
    - title: Что сдаёт команда
      body: |-
        - **Исследовательские заметки** — проблема, исследовательский вопрос, источники, ключевые выводы, предварительное решение. Сессия 1.
        - **Исследовательская записка** — краткий письменный документ на основе данных, не более 2 страниц. Конец сессии 2.
        - **Устная презентация** — проблема, данные, решение, реализуемость и заключение. Сессия 3.
        - **Список литературы** — все использованные источники, оформленные единообразно. Вместе с запиской.
    - title: Требования к исследовательской записке
      body: |-
        - Язык: язык комитета.
        - Объём: не более 2 страниц, включая заголовок и основной текст. Список литературы может быть на дополнительной странице.
        - Шрифт Times New Roman, 12 пт, межстрочный интервал 1,0, поля 2 см со всех сторон, выравнивание по ширине.
        - Заголовок: по центру, полужирный, 14 пт. Заголовки разделов: полужирный, 12 пт.
        - Лаконичный формальный академический язык, без сленга и необоснованных мнений.
        - «Мы» — только для описания собственного процесса работы команды или предлагаемого решения. В анализе — объективный стиль.
        - Формат PDF. Имя файла: `Committee_TeamName_ResearchSolutionBrief.pdf`.
        - Команды отвечают за оригинальность, фактическую точность и корректное цитирование.
    - title: Структура записки
      body: |-
        1. **Заголовок** (1 строка) — конкретный заголовок, показывающий точную проблему и контекст, а не заданную тему.
        2. **Введение / постановка проблемы** (примерно 100 слов) — проблема, затронутые группы, контекст, значимость, причины или последствия.
        3. **Исследовательский вопрос** (1 предложение) — целенаправленный, исследуемый вопрос, на который можно ответить в рамках мероприятия.
        4. **Данные и анализ** (350–450 слов) — значимые факты, статистика и примеры; объяснение значения данных; сравнение, где это уместно.
        5. **Предлагаемое решение** (200–250 слов) — действие, ответственные стороны, шаги, бюджет и ресурсы, источник финансирования, ожидаемый эффект и риски.
        6. **Ограничения и заключение** (100–150 слов) — ограничения данных, времени, источников или реализации; окончательный ответ и рекомендация.
        7. **Список литературы** (по необходимости) — все процитированные источники, оформленные единообразно.

        Ограничения — это слабые стороны или границы исследования либо решения: например, недостаток данных, отсутствие местной статистики, короткое время подготовки, неопределённые затраты, зависимость от согласования или неравное влияние на разные группы.
    - title: Цитирование и список литературы
      body: |-
        Каждая статистическая величина, факт, идея, цитата или утверждение, взятые из источника, должны сопровождаться ссылкой в тексте. Используйте простой формат «автор — год»: (ЮНЕСКО, 2024), (Smith, 2023), (Всемирный банк, 2024). Для прямой цитаты укажите страницу: (ЮНЕСКО, 2024, с. 12). Если дата отсутствует, используйте (ВОЗ, б. д.).

        Не вставляйте одну лишь ссылку. Указывайте автора или организацию, год, название и ссылку. Каждой ссылке в тексте должна соответствовать запись в списке литературы.

        Примеры оформления:

        - Отчёт организации: ЮНЕСКО. (2024). Название отчёта. URL
        - Веб-страница: Всемирный банк. (2023). Название веб-страницы. URL
        - Научная статья: Smith, J. (2024). Название статьи. Название журнала. URL
    - title: Пример
      body: |-
        **Заголовок:** Улучшение доступа к качественному образованию для сельских школьников в Казахстане

        **Исследовательский вопрос:** Как недорогие цифровые образовательные инструменты могут улучшить доступ к качественному обучению для сельских школьников в Казахстане?

        **Пример направления:** Команда могла бы сопоставить данные о доступе к интернету, наличии учителей и образовательных результатах, используя источники ЮНЕСКО, ЮНИСЕФ и Всемирного банка. Возможное решение могло бы сочетать офлайн-материалы для обучения, общие устройства в сельских школах и обучение учителей. Финансирование могло бы поступать из местных бюджетов на образование, грантов в рамках корпоративной социальной ответственности и образовательных партнёрств. К ограничениям можно отнести стоимость устройств, неравномерное качество связи и необходимость поддержки учителей.
    - title: Как оценивает жюри
      body: |-
        - Жюри оценивает представленную работу и выступление, а не только сложность темы.
        - Ко всем командам применяются одинаковые стандарты.
        - Баллы выставляются во время выступления.
        - Необоснованные или искажённые данные снижают балл по критерию «Данные и качество источников».
        - Незначительные грамматические ошибки строго не наказываются, если они не влияют на смысл, точность или ясность.
        - Частое «я/мы» в аналитических разделах отражается на оценке академического стиля, но основной вычет делается, только если это ослабляет объективность или ясность.
  rubrics:
    - title: Письменное исследование
      criteria:
        - name: Исследовательский вопрос
          max: 8
          focus: Целенаправленный, ясный, исследуемый и связанный с проблемой.
        - name: Понимание проблемы
          max: 8
          focus: Точный контекст, причины, последствия и затронутые группы.
        - name: Данные и качество источников
          max: 12
          focus: 3+ надёжных источника; релевантные данные; корректные ссылки.
        - name: Анализ и аргументация
          max: 10
          focus: Объясняет данные и выстраивает логические рассуждения, а не просто описывает.
        - name: Решение и реализуемость
          max: 8
          focus: Конкретное действие, участники, шаги, бюджет и ресурсы, финансирование и эффект.
        - name: Структура, ограничения и стиль
          max: 4
          focus: Соответствует требованиям, объясняет ограничения, лаконично и формально.
    - title: Устное выступление
      criteria:
        - name: Точность и последовательность
          max: 10
          focus: Презентация соответствует записке; данные и утверждения точны.
        - name: Понимание и объяснение
          max: 10
          focus: Выступающие объясняют работу своими словами.
        - name: Структура и ясность
          max: 8
          focus: 'Чёткая цепочка: проблема → данные → решение → заключение.'
        - name: Защита решения
          max: 8
          focus: Объясняет реализуемость, ресурсы, бюджет, финансирование и эффект.
        - name: Подача и вовлечённость
          max: 7
          focus: Голос, темп, зрительный контакт, командная работа, минимум чтения.
        - name: Ответы на вопросы
          max: 7
          focus: Прямые, аргументированные ответы; признаёт ограничения.
  awards:
    - Лучшая исследовательская работа
    - Лучшее устное выступление
    - Команда-победитель каждого комитета
  document: ''
