ru:
  about: |-
    **Youth Research Summit** — межшкольный исследовательский турнир. Команды изучают глобальную проблему, формулируют целенаправленный исследовательский вопрос, анализируют надёжные данные, предлагают реалистичное решение и защищают его перед жюри.

    Наша цель — развивать у школьников исследовательские навыки и критическое мышление: учиться обсуждать научные проблемы, предлагать решения и аргументированно их защищать.
  facts:
    - value: '6'
      label: тематических комитетов
    - value: 2–4
      label: участника в команде
    - value: '100'
      label: 'баллов: 50 за исследование и 50 за выступление'
    - value: '3'
      label: 'рабочих языка: казахский, русский, английский'
