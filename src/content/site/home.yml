en:
  about: |-
    **Youth Research Summit** is an inter-school research tournament. Teams study a global problem, formulate a focused research question, analyse reliable data, propose a realistic solution and defend it before a jury.

    Our goal is to develop students' research skills and critical thinking: to discuss scientific problems, propose solutions and defend them with evidence.
  facts:
    - value: '6'
      label: thematic committees
    - value: 2–4
      label: participants per team
    - value: '100'
      label: 'points: 50 for research and 50 for the presentation'
    - value: '3'
      label: 'working languages: Kazakh, Russian, English'
